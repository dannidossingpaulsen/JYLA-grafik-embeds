.card{display:block;background:white;color:inherit;text-decoration:none;border:1px solid #cfd8e3;border-radius:6px;overflow:hidden;scroll-snap-align:start}
.visual{display:block;position:relative;overflow:hidden;aspect-ratio:16/9;background:#dfe9f6 center/cover}
.visual img{display:block;width:100%;height:100%;object-fit:cover}
.visual img[hidden]{display:none}
.visual.unavailable::after{content:'Billede utilgængeligt';position:absolute;inset:0;display:grid;place-items:center;color:#334155;font:600 13px/1.2 system-ui,sans-serif}
.archive .visual.unavailable::after{content:none}
.card h3{font:700 clamp(19px,2.4vw,24px)/1.18 Georgia,serif;margin:0;padding:14px 14px 18px}
a:hover h3,a:hover{text-decoration:underline}
:focus-visible{outline:3px solid #023b7e;outline-offset:2px}
.card:focus-visible{outline-offset:-4px}
details{margin-top:19px}
summary{display:inline-flex;gap:18px;align-items:center;cursor:pointer;background:#023b7e;color:white;padding:10px 15px;border-radius:4px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-size:20px;line-height:1}
details[open] summary::after{content:'−'}
.archive{margin:16px 0 0;padding:0;list-style:none}
.archive a{display:grid;grid-template-columns:clamp(70px,14vw,112px) minmax(0,1fr);align-items:center;gap:14px;padding:9px 0;border-top:1px solid #cfd8e3;color:inherit;text-decoration:none;font-weight:650;line-height:1.35}
.archive a:hover .headline{text-decoration:underline}
.archive .visual{border-radius:3px}
@media(max-width:650px){
 .cards{grid-auto-columns:84%;gap:10px}
}
@media(prefers-reduced-motion:reduce){.cards{scroll-behavior:auto}}
</style>

<script>
'use strict';

// Tilføj artikler i JSON-listen. Publiceringstidspunktet styrer rækkefølgen.
// Brug ?artikel=19845648 til at udelade den artikel, modulet er indlejret i.
const articles = JSON.parse(document.querySelector('#articles').textContent);
const current = new URLSearchParams(location.search).get('artikel');
const available = articles.filter(article => article.id !== current)
  .sort((first, second) => Date.parse(second.published) - Date.parse(first.published));
const cards = document.querySelector('.cards');
const previous = document.querySelector('#previous');
const next = document.querySelector('#next');
const details = document.querySelector('details');
const summary = details.querySelector('summary');
const archive = details.querySelector('.archive');

function articleImage(article, lazy) {
  const visual = document.createElement('span');
  visual.className = 'visual';
  const image = document.createElement('img');
  image.alt = '';
  image.loading = lazy ? 'lazy' : 'eager';
  image.addEventListener('error', () => {
    image.hidden = true;
    visual.classList.add('unavailable');
  });
  image.src = article.image;
  visual.append(image);
  return visual;
}

function articleLink(article) {
  const link = document.createElement('a');
  link.href = article.url;
  link.target = '_top';
  return link;
}

for (const [index, article] of available.entries()) {
  const card = articleLink(article);
  card.className = 'card';
  const title = document.createElement('h3');
  title.textContent = article.title;
  card.append(articleImage(article, index >= 3), title);
  cards.append(card);

  const item = document.createElement('li');
  const link = articleLink(article);
  const headline = document.createElement('span');
  headline.className = 'headline';
  headline.textContent = article.title;
  link.append(articleImage(article, true), headline);
  item.append(link);
  archive.append(item);
}

function updateArrows() {
  previous.disabled = cards.scrollLeft <= 1;
  next.disabled = cards.scrollLeft + cards.clientWidth >= cards.scrollWidth - 1;
}

function slide(direction) {
  if (cards.children.length < 2) return;
  const step = cards.children[1].offsetLeft - cards.children[0].offsetLeft;
  cards.scrollBy({ left: direction * step });
}

previous.addEventListener('click', () => slide(-1));
next.addEventListener('click', () => slide(1));
cards.addEventListener('scroll', updateArrows, { passive: true });
new ResizeObserver(updateArrows).observe(cards);
updateArrows();

function updateSummary() {
  summary.textContent = details.open
    ? 'Skjul artikeloversigten'
    : `Se alle ${available.length} artikler`;
}
details.addEventListener('toggle', updateSummary);
updateSummary();

if (window.parent !== window) {
  document.documentElement.classList.add('embedded');
  const wrap = document.querySelector('.wrap');
  let lastHeight = 0;
  let lastWidth = 0;
  let measurementScheduled = false;

  function measure() {
    measurementScheduled = false;
    const wrapTop = wrap.getBoundingClientRect().top;
    let bottom = 0;
    for (const child of wrap.children) {
      if (getComputedStyle(child).display === 'none') continue;
      bottom = Math.max(bottom, child.getBoundingClientRect().bottom - wrapTop);
    }
    const bottomPadding = parseFloat(getComputedStyle(wrap).paddingBottom) || 0;
    const height = Math.ceil(bottom + bottomPadding);
    if (height > 0 && height !== lastHeight) {
      lastHeight = height;
      window.parent.postMessage({ type: 'rewater:resize', height }, '*');
    }
  }

  function scheduleMeasurement() {
    if (measurementScheduled) return;
    measurementScheduled = true;
    requestAnimationFrame(measure);
  }

  new ResizeObserver(() => {
    const width = wrap.clientWidth;
    if (width !== lastWidth) {
      lastWidth = width;
      scheduleMeasurement();
    }
  }).observe(wrap);
  new MutationObserver(scheduleMeasurement).observe(wrap, {
    childList: true,
    subtree: true,
    characterData: true
  });
  details.addEventListener('toggle', scheduleMeasurement);
  window.addEventListener('load', scheduleMeasurement);
  document.fonts?.ready.then(scheduleMeasurement);
  scheduleMeasurement();
}
</script>
