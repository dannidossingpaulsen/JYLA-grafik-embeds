name: Opdatér ReWater-artikler

on:
  push:
    branches: [main]
    paths:
      - rewater/artikler.txt
      - rewater/opdater-artikler.py
      - .github/workflows/rewater-artikler.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rewater-artikler
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Hent rubrik, billede og publiceringstid
        run: python3 rewater/opdater-artikler.py
      - name: Gem det opdaterede modul
        id: save
        run: |
          if git diff --quiet -- rewater/index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rewater/index.html
          git commit -m 'Opdatér artikler i ReWater-modulet'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Start GitHub Pages-udgivelsen
        if: steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
