<div id="info" role="dialog" aria-label="Trafiktiltag" aria-describedby="description" hidden><p id="description"></p><button class="close" aria-label="Luk tekstvindue">×</button></div></div><footer>Kort fra Teknik og Miljø i Aarhus Kommune.</footer></main>
<script>
if(window.parent!==window)document.documentElement.classList.add('embedded');
const view=document.querySelector('.view'),map=document.querySelector('.map'),info=document.querySelector('#info'),closeButton=document.querySelector('.close');
let selected=null,level=0;
const steps=[1,1.6,2.5,4];
function closeInfo(restore=false){
 if(!selected)return;
 selected.setAttribute('aria-expanded','false');
 if(restore)selected.focus({preventScroll:true});
 selected=null;info.hidden=true;
}
function position(){
 if(!selected)return;
 const v=view.getBoundingClientRect(),p=selected.getBoundingClientRect();
 const x=p.left+p.width/2-v.left,y=p.top+p.height/2-v.top;
 if(x<0||x>v.width||y<0||y>v.height){closeInfo();return}
 const left=Math.max(8,Math.min(x-info.offsetWidth/2,view.clientWidth-info.offsetWidth-8));
 const below=p.bottom-v.top+8,above=p.top-v.top-info.offsetHeight-8;
 info.style.left=left+'px';
 info.style.top=Math.max(4,Math.min(below+info.offsetHeight>Math.min(v.height,innerHeight-v.top)&&above>=0?above:below,v.height-info.offsetHeight-4))+'px';
}
map.addEventListener('click',e=>{
 const b=e.target.closest('.point');
 if(!b||selected===b){closeInfo(!!b);return}
 closeInfo();selected=b;b.setAttribute('aria-expanded','true');
 document.querySelector('#description').textContent=b.dataset.description;
 info.hidden=false;position();closeButton.focus({preventScroll:true});
});
closeButton.onclick=()=>closeInfo(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo(true)});
function zoom(delta){
 const x=(view.scrollLeft+view.clientWidth/2)/map.offsetWidth,y=(view.scrollTop+view.clientHeight/2)/map.offsetHeight;
 closeInfo();level+=delta;view.classList.toggle('zoomed',level>0);map.style.setProperty('--zoom',steps[level]);
 view.scrollTo(level ? map.offsetWidth*x-view.clientWidth/2 : 0, level ? map.offsetHeight*y-view.clientHeight/2 : 0);
 minus.disabled=level===0;plus.disabled=level===steps.length-1;
}
const minus=document.querySelector('#minus'),plus=document.querySelector('#plus');
minus.disabled=true;minus.onclick=()=>zoom(-1);plus.onclick=()=>zoom(1);
view.addEventListener('scroll',position);window.addEventListener('resize',position);
// Report the height needed at full article-column width, independent of zoom.
if (window.parent !== window) {
 const header=document.querySelector('header'),footer=document.querySelector('footer');
 function sendHeight(){
   const height=Math.ceil(header.getBoundingClientRect().height+
     view.getBoundingClientRect().width*2048/1378+footer.getBoundingClientRect().height);
   window.parent.postMessage({type:'dinavis-trafikoer-height',height},'*');
 }
 const observer=new ResizeObserver(sendHeight);
 for(const element of [header,view,footer]) observer.observe(element);
 window.addEventListener('load',sendHeight);
 window.addEventListener('message',event=>{
   if(event.source===window.parent && event.data==='dinavis-trafikoer-measure') sendHeight();
 });
}
</script></html>
