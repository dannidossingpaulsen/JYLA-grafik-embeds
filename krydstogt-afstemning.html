<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Afstemning: Krydstogtskibe i Aarhus</title>
<style>
  :root{
    --bg:#f5f7fb;--card:#fff;--ink:#132238;--muted:#667085;--line:#d7dfeb;
    --accent:#0b3a63;--accent2:#2a8cc8;--bar:#cfe8f7;--shadow:0 18px 45px rgba(12,30,55,.13);
  }
  *{box-sizing:border-box} body{margin:0;background:transparent;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
  .poll{max-width:760px;margin:0 auto;padding:14px}
  .card{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px}
  .wave{position:absolute;inset:auto -10% -72px -10%;height:150px;background:radial-gradient(ellipse at 25% 0%,rgba(42,140,200,.18),transparent 55%),linear-gradient(90deg,rgba(42,140,200,.20),rgba(11,58,99,.10));border-radius:50% 50% 0 0;animation:drift 7s ease-in-out infinite alternate;pointer-events:none}
  @keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
  .kicker{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 6px rgba(42,140,200,.12)}
  h1{font-size:clamp(22px,4.8vw,34px);line-height:1.08;margin:0 0 8px;max-width:620px}
  .sub{color:var(--muted);font-size:15px;margin:0 0 22px}
  .options{display:grid;gap:12px;position:relative;z-index:1}
  button.option{width:100%;border:1px solid var(--line);border-radius:17px;background:#fff;padding:16px 18px;text-align:left;font-size:18px;font-weight:750;color:var(--ink);cursor:pointer;transition:.18s transform,.18s border-color,.18s box-shadow;display:flex;align-items:center;justify-content:space-between;gap:16px}
  button.option:hover{transform:translateY(-1px);border-color:#a9c9df;box-shadow:0 10px 22px rgba(11,58,99,.08)}
  button.option:active{transform:translateY(0)}
  .chev{opacity:.45;font-size:22px}.results{display:none;position:relative;z-index:1;gap:14px}.row{display:grid;gap:7px}.label{display:flex;justify-content:space-between;gap:16px;font-size:15px;font-weight:750}.pct{font-variant-numeric:tabular-nums;color:var(--accent)}
  .track{height:36px;background:#edf3f8;border-radius:999px;overflow:hidden;border:1px solid #dbe7f1}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--bar),#86c7ec);border-radius:999px;transition:width 900ms cubic-bezier(.2,.8,.2,1);position:relative}.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shine 1.6s ease .4s 1}@keyframes shine{to{transform:translateX(100%)}}
  .note{margin-top:18px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.reset{border:0;background:transparent;color:var(--accent2);font-weight:700;cursor:pointer;padding:0}.thanks{font-size:16px;font-weight:800;margin:0 0 14px;color:var(--accent)}
  .ship{position:absolute;right:22px;bottom:28px;width:96px;height:34px;opacity:.16;z-index:0;animation:sail 9s linear infinite}.ship svg{width:100%;height:100%}@keyframes sail{from{transform:translateX(70px)}to{transform:translateX(-760px)}}
  @media(max-width:520px){.card{padding:22px 18px;border-radius:20px}.sub{font-size:14px}button.option{font-size:16px;padding:15px}.track{height:32px}}
</style>
</head>
<body>
  <main class="poll">
    <section class="card" aria-label="Afstemning om krydstogtskibe i Aarhus">
      <div class="ship" aria-hidden="true"><svg viewBox="0 0 240 80"><path d="M19 52h168c16 0 30-8 38-22H72l-8-16H42l-7 16H9c-6 0-8 8-3 12l13 10Z" fill="#0b3a63"/><rect x="82" y="13" width="75" height="17" rx="3" fill="#0b3a63"/><rect x="163" y="20" width="26" height="10" rx="2" fill="#0b3a63"/></svg></div>
      <div class="kicker"><span class="dot"></span> Læserafstemning</div>
      <h1>Hvad synes du om antallet af krydstogtskibe, der kommer til Aarhus?</h1>
      <p class="sub">Klik på det svar, der passer bedst. Afstemningen er ikke videnskabelig.</p>
      <div id="options" class="options">
        <button class="option" data-choice="ok">Det er ok <span class="chev">›</span></button>
        <button class="option" data-choice="many">Det er for mange <span class="chev">›</span></button>
        <button class="option" data-choice="dontknow">Det ved jeg ikke <span class="chev">›</span></button>
      </div>
      <div id="results" class="results" aria-live="polite">
        <p class="thanks">Tak for din stemme</p>
        <div class="row"><div class="label"><span>Det er ok</span><span class="pct" id="pct-ok">0%</span></div><div class="track"><div class="fill" id="bar-ok"></div></div></div>
        <div class="row"><div class="label"><span>Det er for mange</span><span class="pct" id="pct-many">0%</span></div><div class="track"><div class="fill" id="bar-many"></div></div></div>
        <div class="row"><div class="label"><span>Det ved jeg ikke</span><span class="pct" id="pct-dontknow">0%</span></div><div class="track"><div class="fill" id="bar-dontknow"></div></div></div>
        <div class="note"><span id="total">0 stemmer</span><button class="reset" id="reset" type="button">Nulstil lokalt</button></div>
      </div>
      <div class="wave"></div>
    </section>
  </main>
<script>
(function(){
  const KEY='aarhus-cruise-poll-v1';
  const defaults={ok:0,many:0,dontknow:0};
  const demoSeed={ok:37,many:58,dontknow:15};
  let data=JSON.parse(localStorage.getItem(KEY)||'null')||demoSeed;
  const votedKey=KEY+'-voted';
  const options=document.getElementById('options');
  const results=document.getElementById('results');
  function total(){return Object.values(data).reduce((a,b)=>a+b,0)}
  function pct(v){const t=total();return t?Math.round(v/t*100):0}
  function render(){
    ['ok','many','dontknow'].forEach(k=>{const p=pct(data[k]);document.getElementById('pct-'+k).textContent=p+'%';setTimeout(()=>document.getElementById('bar-'+k).style.width=p+'%',80);});
    document.getElementById('total').textContent=total().toLocaleString('da-DK')+' stemmer';
  }
  function showResults(){options.style.display='none';results.style.display='grid';render()}
  options.addEventListener('click',e=>{const btn=e.target.closest('button[data-choice]');if(!btn)return;const c=btn.dataset.choice;data[c]++;localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(votedKey,c);showResults();});
  document.getElementById('reset').addEventListener('click',()=>{localStorage.removeItem(KEY);localStorage.removeItem(votedKey);data=JSON.parse(JSON.stringify(demoSeed));location.reload();});
  if(localStorage.getItem(votedKey)) showResults();
})();
</script>
</body>
</html>
