<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krydstogtskib ved Aarhus Havn – mini-animation</title>
<style>
  :root{--water:#cfe1f7;--harbour:#07345b;--harbour2:#0b426e;--red:#e7333f;--ink:#08263f;--paper:#f8fbff}
  *{box-sizing:border-box} body{margin:0;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
  .frame{width:100%;max-width:920px;margin:0 auto;background:linear-gradient(180deg,#eef6ff 0%,#d8eaff 100%);border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/9;box-shadow:0 12px 35px rgba(0,31,63,.16)}
  svg{width:100%;height:100%;display:block}
  .title{position:absolute;left:28px;top:24px;z-index:5;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:14px;padding:14px 16px;max-width:420px;box-shadow:0 8px 22px rgba(0,31,63,.12)}
  .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#58718b;margin-bottom:3px}.headline{font-size:clamp(20px,3vw,34px);font-weight:850;line-height:1.02}.sub{margin-top:6px;font-size:14px;color:#3a5874;line-height:1.25}.caption{position:absolute;right:18px;bottom:14px;z-index:5;font-size:11px;color:#49647d;background:rgba(255,255,255,.8);padding:7px 9px;border-radius:10px}.label{font-size:13px;fill:#d9edff;font-weight:800;letter-spacing:.02em}.smalllabel{font-size:10px;fill:#d9edff;font-weight:700;letter-spacing:.04em}.shore{fill:#426282}.harbour{fill:var(--harbour)}.pier{fill:#0a3d67}.dockline{stroke:#d9edff;stroke-width:2.2;stroke-linecap:round;opacity:.72}.zone{fill:rgba(231,51,63,.22);stroke:rgba(231,51,63,.75);stroke-width:2.5;transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 4.4s ease-in-out infinite}.z1{animation-delay:1.3s}.z2{animation-delay:1.8s}.z3{animation-delay:2.3s}.z4{animation-delay:2.8s}.z5{animation-delay:3.3s}.z6{animation-delay:3.8s}.zone-name{font-size:10px;fill:#9b1720;font-weight:900;opacity:0;animation:fadeLabel 18s ease-in-out infinite}.n1{animation-delay:1.7s}.n2{animation-delay:2.2s}.n3{animation-delay:2.7s}.n4{animation-delay:3.2s}.n5{animation-delay:3.7s}.n6{animation-delay:4.2s}.route{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:7 9;opacity:.85}.ship{filter:drop-shadow(0 7px 12px rgba(0,20,40,.28));transform-box:view-box;transform-origin:center;animation:sail 18s cubic-bezier(.48,0,.1,1) infinite}.ship-body{fill:#fff}.ship-dark{fill:#123b5e}.ship-window{fill:#ffdd83;opacity:0;animation:lights 18s ease-in-out infinite}.night{fill:#051a32;opacity:0;animation:night 18s ease-in-out infinite}.moon{fill:#fff6c8;opacity:0;animation:moon 18s ease-in-out infinite}.note{font-size:20px;fill:white;font-weight:900;opacity:0;animation:overnat 18s ease-in-out infinite}.arrow{stroke:white;stroke-width:3;marker-end:url(#arrow);opacity:0;animation:overnat 18s ease-in-out infinite}.steptext{font-size:18px;fill:#0b2944;font-weight:850;opacity:0}.sA{animation:stepA 18s ease-in-out infinite}.sB{animation:stepB 18s ease-in-out infinite}.sC{animation:stepC 18s ease-in-out infinite}.pulse-ring{fill:none;stroke:#e7333f;stroke-width:5;opacity:0;animation:ring 18s ease-in-out infinite}
  @keyframes pulse{0%,18%{opacity:0;transform:scale(.72)}25%,78%{opacity:1;transform:scale(1)}45%{transform:scale(1.08)}58%{transform:scale(.99)}100%{opacity:0;transform:scale(1.12)}}
  @keyframes fadeLabel{0%,20%{opacity:0}28%,77%{opacity:1}100%{opacity:0}}
  @keyframes sail{0%,22%{transform:translate(-300px,140px) rotate(-18deg)}45%,100%{transform:translate(0,0) rotate(0deg)}}
  @keyframes lights{0%,54%{opacity:0}61%,86%{opacity:.95}100%{opacity:0}}
  @keyframes night{0%,55%{opacity:0}68%,86%{opacity:.45}100%{opacity:0}}
  @keyframes moon{0%,61%{opacity:0;transform:translateY(15px)}70%,88%{opacity:.95;transform:translateY(0)}100%{opacity:0}}
  @keyframes overnat{0%,58%{opacity:0}66%,84%{opacity:1}100%{opacity:0}}
  @keyframes stepA{0%,18%{opacity:1}23%,100%{opacity:0}}
  @keyframes stepB{0%,22%{opacity:0}31%,49%{opacity:1}56%,100%{opacity:0}}
  @keyframes stepC{0%,48%{opacity:0}55%,85%{opacity:1}100%{opacity:0}}
  @keyframes ring{0%,58%{opacity:0;transform:scale(.7)}65%{opacity:.9;transform:scale(1)}82%{opacity:.35;transform:scale(1.12)}100%{opacity:0;transform:scale(1.25)}}
  @media(max-width:620px){.frame{border-radius:0;aspect-ratio:4/5}.title{left:14px;top:14px;right:14px;max-width:none}.sub{font-size:13px}.caption{display:none}.label{font-size:11px}.smalllabel{font-size:8px}}
</style>
</head>
<body>
<div class="frame" role="img" aria-label="Illustrativ animation: Et krydstogtskib sejler ind til Omniterminalen ved Aarhus Havn, mens røde konsekvenszoner omkring risikovirksomheder pulserer.">
  <div class="title"><div class="kicker">Illustration</div><div class="headline">Når krydstogtskibet lægger til</div><div class="sub">Røde zoner viser princippet i konsekvenszoner omkring risikovirksomheder. Placeringer og radius er illustrative.</div></div>
  <svg viewBox="0 0 920 518" aria-hidden="true">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="white"/></marker></defs>
    <rect width="920" height="518" fill="var(--water)"/>
    <path class="shore" d="M0,445 L112,485 L235,512 L365,518 L0,518 Z" opacity=".9"/>
    <path class="shore" d="M748,336 L807,315 L883,358 L920,372 L920,518 L731,518 Z" opacity=".9"/>
    <!-- Aarhus Havn, mørk silhuet på lyst vand -->
    <path class="harbour" d="M383,31 L424,6 L789,301 L830,308 L878,352 L854,415 L718,424 L610,405 L540,386 L435,382 L347,363 L333,333 L262,315 L308,255 L407,288 L418,262 L529,304 L547,244 L626,201 L701,237 L788,297 L796,238 L754,205 L665,135 L574,73 L480,14 L432,58 L367,54 Z"/>
    <path class="pier" d="M335,340 L526,359 L648,395 L641,414 L510,389 L331,366 Z"/>
    <path class="pier" d="M399,374 L504,389 L481,418 L388,407 Z"/>
    <path class="pier" d="M262,315 L204,339 L155,339 L102,395 L43,378 L83,332 L121,256 L183,295 L239,291 Z" opacity=".9"/>
    <path class="dockline" d="M276,309 L307,257 L407,289"/><path class="dockline" d="M549,246 L626,202"/><path class="dockline" d="M335,339 L527,358"/><path class="dockline" d="M655,397 L787,415"/>
    <text x="436" y="174" class="label">CONTAINERTERMINAL</text><text x="440" y="302" class="label">OMNITERMINAL</text><text x="406" y="401" class="smalllabel">MELLEMARMEN</text><text x="655" y="245" class="smalllabel">AARHUS HAVN</text><text x="716" y="273" class="smalllabel">BULKTERMINAL</text><text x="724" y="333" class="smalllabel">MULTITERMINAL VEST</text>
    <text x="60" y="454" class="steptext sA">1 / Havnen set oppefra</text><text x="60" y="454" class="steptext sB">2 / Konsekvenszoner toner frem</text><text x="60" y="454" class="steptext sC">3 / Skibet lægger til for natten</text>
    <path class="route" d="M164,557 C241,471 333,414 435,391 C506,376 556,367 607,330"/>
    <!-- zoner ved risikovirksomheder, illustrative -->
    <circle class="zone z1" cx="610" cy="318" r="84"/><circle class="zone z2" cx="656" cy="277" r="75"/><circle class="zone z3" cx="714" cy="320" r="73"/><circle class="zone z4" cx="548" cy="355" r="67"/><circle class="zone z5" cx="455" cy="386" r="58"/><circle class="zone z6" cx="750" cy="365" r="62"/>
    <text class="zone-name n1" x="574" y="315">Samtank</text><text class="zone-name n2" x="634" y="263">Q8</text><text class="zone-name n3" x="684" y="318">Olieterminal</text><text class="zone-name n4" x="518" y="349">Tanklager</text><text class="zone-name n5" x="428" y="378">Risiko</text><text class="zone-name n6" x="727" y="358">Seveso</text>
    <circle class="pulse-ring" cx="607" cy="330" r="48"/>
    <!-- Skib ved Omniterminal -->
    <g class="ship" transform="translate(0 0)">
      <g transform="translate(579 307) rotate(-32)">
        <path class="ship-body" d="M-83,-16 L66,-16 L91,0 L73,18 L-68,18 L-92,2 Z"/>
        <rect class="ship-dark" x="-55" y="-31" width="86" height="15" rx="2"/><rect class="ship-dark" x="-24" y="-44" width="48" height="13" rx="2"/>
        <circle class="ship-window" cx="-42" cy="-23" r="2.8"/><circle class="ship-window" cx="-28" cy="-23" r="2.8"/><circle class="ship-window" cx="-14" cy="-23" r="2.8"/><circle class="ship-window" cx="0" cy="-23" r="2.8"/><circle class="ship-window" cx="14" cy="-23" r="2.8"/><circle class="ship-window" cx="28" cy="-23" r="2.8"/>
      </g>
    </g>
    <rect class="night" width="920" height="518"/><circle class="moon" cx="840" cy="70" r="22"/><text class="note" x="646" y="118">Overnatning tæt på zonerne</text><line class="arrow" x1="700" y1="126" x2="622" y2="295"/>
  </svg>
  <div class="caption">Grafisk principillustration – ikke opmålt kortmateriale</div>
</div>
</body>
</html>
